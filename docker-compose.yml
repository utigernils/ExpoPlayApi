  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ExpoPlay_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 512M
    ports:
      - "8080:80"
    depends_on:
      - mariadb

