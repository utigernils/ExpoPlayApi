version: '3.8'

services:
  mariadb:
    image: mariadb:11.4
    container_name: ExpoPlay_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: verysecure
      MYSQL_DATABASE: ExpoPlay_entw
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravelpass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql


